# ### Hyprland ###
# Apps
$terminal = foot
$browser = firefox
$editor = kitty nvim
$fileExplorer = thunar

# Touchpad
$touchpadDisableTyping = true
$touchpadScrollFactor = 0.3
$workSpaceSwipeFingers = 4

# Blur
$blurEnabled = false
$blurSpecialWs = false
$blurPopups = true
$blurInputMethods = true
$blurSize = 30
$blurPasses = 2
$blurXray = false

# Shadow
$shadowEnabled = true
$shadowRange = 30
$shadowRenderPower = 3
$shadowColour = rgba($surfaced4)

# Gaps
$workspaceGaps = 20
$windowGapsIn = 6
$windowGapsOut = 15
$singleWindowGapsOut = 10

# Window styling
$windowOpacity = 1
$windowRounding = 15

$windowBorderSize = 1
$activeWindowBorderColour = rgba($primarye6)
$inactiveWindowBorderColour = rgba($onSurfaceVariant11)

# Misc
$volumeStep = 5  # In percent
